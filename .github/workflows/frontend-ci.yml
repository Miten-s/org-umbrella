name: Frontend CI

# Code-quality gates that block the merge. Every step is independent so a
# failure points at exactly what's wrong (typecheck vs lint vs format vs tests).
on:
  push:
    branches: [main, master, development, mp/handle-access-module]
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]
  pull_request:
    branches: [main, master, development, mp/handle-access-module]
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]

defaults:
  run:
    working-directory: frontend

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (reproducible)
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      # Temporarily skipped:
      # - name: Lint
      #   run: npm run eslint:ci

      # - name: Format check (Prettier)
      #   continue-on-error: true
      #   run: npm run prettier:ci

      # - name: Unit tests
      #   run: npm run test

      - name: Build
        run: npm run build
