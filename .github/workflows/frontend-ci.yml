name: Frontend CI

# Code-quality gates that block the merge. Every step is independent so a
# failure points at exactly what's wrong (typecheck vs lint vs format vs tests).
on:
  push:
    branches: [main, master, development]
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]

defaults:
  run:
    working-directory: frontend

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (reproducible)
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      # Blocks NEW warnings; 14 legacy react-hooks/exhaustive-deps warnings are
      # baselined (--max-warnings=14). Burn down via useCallback(openForm) then
      # lower the number toward 0. The pre-commit hook already enforces 0 on
      # changed files, so the count can only shrink.
      - name: Lint
        run: npm run eslint:ci

      # Informational until the repo is formatted once (`npm run prettier:fix`);
      # the pre-commit hook already format-checks changed files. Flip to a hard
      # gate (remove continue-on-error) after that one-time pass.
      - name: Format check (Prettier)
        continue-on-error: true
        run: npm run prettier:ci

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
