name: GxP Service CI

on:
  push:
    branches: [ "main", "mp/handle-access-module" ]
    paths:
      - 'gxp-service/**'
      - '.github/workflows/gxp-service.yml'
  pull_request:
    branches: [ "main", "mp/handle-access-module" ]
    paths:
      - 'gxp-service/**'
      - '.github/workflows/gxp-service.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: ./gxp-service
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/gxp-service:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/gxp-service:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/mp/handle-access-module') ||
      (github.event_name == 'pull_request' && github.base_ref == 'mp/handle-access-module')
    
    steps:
    - name: Deploy to EC2
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
        script: |
          cd ~/org-umbrella
          git config --global --add safe.directory $(pwd)
          git fetch origin
          git checkout sp/docker-based-deployment
          git pull origin sp/docker-based-deployment
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          infisical run --env=prod --path=/gxp-service --recursive -- docker compose -f docker-compose.yml pull gxp-service
          docker compose -f docker-compose.yml stop gxp-service
          docker compose -f docker-compose.yml rm -f gxp-service
          infisical run --env=prod --path=/gxp-service --recursive -- docker compose -f docker-compose.yml up -d --no-deps gxp-service
          docker image prune -f
