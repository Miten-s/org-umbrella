name: Frontend CI

on:
  push:
    branches: [ "main", "mp/handle-access-module" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [ "main", "mp/handle-access-module" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{ github.sha }}
        build-args: |
          VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL || secrets.VITE_API_BASE || '/auth/v1/api' }}
          VITE_API_GXP_BASE_URL=${{ secrets.VITE_API_GXP_BASE_URL || secrets.GXP || '/gxp/v1/api' }}
          VITE_API_LIMS_BASE_URL=${{ secrets.VITE_API_LIMS_BASE_URL || secrets.LIMS || '/lims/v1/api' }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/mp/handle-access-module') ||
      (github.event_name == 'pull_request' && github.base_ref == 'mp/handle-access-module')
    
    steps:
    - name: Deploy to EC2
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
        script: |
          cd ~/org-umbrella
          git fetch origin
          git checkout sp/docker-based-deployment
          git pull origin sp/docker-based-deployment
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          infisical run --env=prod --path=/frontend --recursive -- docker compose -f docker-compose.yml pull frontend
          docker compose -f docker-compose.yml stop frontend
          docker compose -f docker-compose.yml rm -f frontend
          infisical run --env=prod --path=/frontend --recursive -- docker compose -f docker-compose.yml up -d --no-deps frontend
