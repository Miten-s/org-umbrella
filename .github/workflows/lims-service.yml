name: LIMS Service CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'lims-service/**'
      - '.github/workflows/lims-service.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'lims-service/**'
      - '.github/workflows/lims-service.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./lims-service
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './lims-service/package-lock.json'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Typecheck
      run: npm run build
      
    - name: Lint
      run: npm run lint

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    # Only push on main branch merges, not PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: ./lims-service
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/lims-service:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/lims-service:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /path/to/your/LMIS/repo
          docker compose pull lims-service
          docker compose up -d lims-service
