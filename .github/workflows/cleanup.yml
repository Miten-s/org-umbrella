name: EC2 Docker Cleanup

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Backend CI/CD", "Frontend CI/CD", "GxP Service CI/CD", "LIMS Service CI/CD"]
    types:
      - completed
    branches:
      - main
      - development

jobs:
  docker-cleanup:
    name: Cleanup Docker System Prune on EC2
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: SSH and Prune Docker Resources
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Starting Safe Docker System Prune on EC2..."
            docker system prune -af || true
            echo "Safe Docker System Prune completed successfully!"

