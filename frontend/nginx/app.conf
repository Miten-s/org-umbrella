upstream backend_api {
  server backend:9000;
}

upstream gxp_api {
  server gxp-service:9001;
}

server {
  listen 80;
  server_name _;

  # Uploads can be large (multer accepts images/docs); nginx defaults to 1m and
  # would reject them with a 413 before the request ever reaches express.
  client_max_body_size 25m;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # --- API: auth/core service ------------------------------------------------
  # The trailing slash on proxy_pass strips the /auth prefix, so /auth/v1/api/x
  # arrives at express as /v1/api/x — matching how the routers are mounted.
  # This also covers uploaded assets: getImageUrl() in utils.service.ts strips
  # the /v1/api suffix off the base URL and appends /uploads/..., producing
  # /auth/uploads/x, which lands on express's static handler as /uploads/x.
  location /auth/ {
    proxy_pass http://backend_api/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # --- API: gxp service ------------------------------------------------------
  location /gxp/ {
    proxy_pass http://gxp_api/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # --- Static assets ---------------------------------------------------------
  # Vite emits content-hashed filenames, so these are safe to cache forever.
  location /assets/ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # --- SPA ------------------------------------------------------------------
  # index.html must never be cached, or clients keep loading a stale bundle
  # reference after a deploy.
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
