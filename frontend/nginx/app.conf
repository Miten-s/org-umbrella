# Per-client-IP request limiting. This is the layer that sees the real client address;
# each service also keeps a stricter in-app limiter as a backstop for direct access.
# 10m holds roughly 160k addresses.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_status 429;

upstream backend_api {
  server backend:9000;
}

upstream gxp_api {
  server gxp-service:9001;
}

upstream lims_api {
  server lims-service:9002;
}

server {
  listen 4173;
  listen 80;
  server_name _;

  # Uploads can be large (multer accepts images/docs); nginx defaults to 1m and
  # would reject them with a 413 before the request ever reaches express.
  client_max_body_size 25m;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # --- API: auth/core service ------------------------------------------------
  location /auth/v1/api/ {
    limit_req zone=api_limit burst=40 nodelay;
    proxy_pass http://backend_api/v1/api/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  location /auth/uploads/ {
    proxy_pass http://backend_api/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }

  # --- API: gxp service ------------------------------------------------------
  location /gxp/v1/api/ {
    limit_req zone=api_limit burst=40 nodelay;
    proxy_pass http://gxp_api/v1/api/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  location /gxp/uploads/ {
    proxy_pass http://gxp_api/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }

  # --- API: lims service ------------------------------------------------------
  location /lims/v1/api/ {
    limit_req zone=api_limit burst=40 nodelay;
    proxy_pass http://lims_api/v1/api/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  location /lims/uploads/ {
    proxy_pass http://lims_api/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }

  # --- Static assets ---------------------------------------------------------
  location /assets/ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # --- SPA Fallback ----------------------------------------------------------
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}

