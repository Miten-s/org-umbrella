# Local-dev Postgres + Redis for backend / gxp-service / lims-service,
# replacing the shared Neon/Redis instances. Postgres runs on 5433 (not
# 5432) so it never collides with a system-installed Postgres. Fresh volume
# — no data is copied from Neon, each service builds its own schema via its
# built-in migration runner on first connect.
#
# Redis needs redis/redis.conf to exist first (gitignored, see readme.md
# for the one-line `requirepass ...` content).
#
# Usage:
#   docker compose -f docker-compose.local.yml up -d --wait
#   docker compose -f docker-compose.local.yml down        # stop, keep data
#   docker compose -f docker-compose.local.yml down -v     # stop, wipe data
name: umbrella-local

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # POSTGRES_DB is intentionally omitted — init-databases.sh creates all
      # three databases the services need.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - umbrella_local_pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-local-databases.sh:/docker-entrypoint-initdb.d/init-local-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qE 'PONG|NOAUTH'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  kafka:
    image: apache/kafka:${KAFKA_IMAGE_TAG:-3.7.0}
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-127.0.0.1:9092}:9092"
      - "${KAFKA_EXTERNAL_PORT:-127.0.0.1:9094}:9094"
    environment:
      KAFKA_NODE_ID: ${KAFKA_NODE_ID:-1}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://${KAFKA_HOST:-kafka}:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-127.0.0.1}:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-1}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-1}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka-ui:
    image: provectuslabs/kafka-ui:${KAFKA_UI_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${KAFKA_UI_PORT:-127.0.0.1:8085}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ${KAFKA_CLUSTER_NAME:-local-cluster}
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_BROKER:-kafka:9092}
      DYNAMIC_CONFIG_ENABLED: "true"
      AUTH_TYPE: ${KAFKA_UI_AUTH_TYPE:-DISABLED}
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_USERNAME:-}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD:-}
    depends_on:
      kafka:
        condition: service_healthy



volumes:
  umbrella_local_pgdata:


